[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-stylist"
version = "0.1.0"
description = "A conversational stylist grounded only in the catalog, every recommendation traceable to a SKU, 100% locally."
requires-python = "==3.12.*"
license = "MIT"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length is handled by `ruff format`; long strings stay readable

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the embedding model and Ollama with the default model; excluded from CI"]
