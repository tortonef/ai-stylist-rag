<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <!-- Shared portfolio banner layout. Per repo, change only: the accent color (#6B8F71),
       title, tagline lines and the motif group on the right. -->
  <title id="title">AI Stylist (RAG)</title>
  <desc id="desc">A conversational stylist that answers outfit questions using only real products from the catalog, with every recommendation traceable to a SKU, 100% locally.</desc>
  <style>
    .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .ink { fill: #1F1B24; }
    .accent { fill: #6B8F71; }
  </style>

  <!-- Opaque background: legible in both GitHub light and dark mode -->
  <rect width="1280" height="320" fill="#F6F1E9"/>
  <rect width="10" height="320" class="accent"/>

  <!-- Text block -->
  <text x="72" y="125" class="font ink" font-size="52" font-weight="700">AI Stylist</text>
  <g class="font ink" font-size="20" fill-opacity="0.78">
    <text x="72" y="177">Answer "what should I wear?" questions with complete outfits</text>
    <text x="72" y="205">built only from real catalog products, every recommendation</text>
    <text x="72" y="233">traceable to a SKU, 100% locally.</text>
  </g>

  <!-- Motif: a shopper's question -> answer grounded in catalog products, each tagged with its SKU -->
  <g transform="translate(840 50)">
    <rect width="190" height="220" rx="14" fill="#FFFFFF" stroke="#1F1B24" stroke-opacity="0.12" stroke-width="2"/>
    <!-- question bubble -->
    <path d="M58 22 H170 Q176 22 176 28 V66 Q176 72 170 72 H74 L62 82 L64 72 H58 Q52 72 52 66 V28 Q52 22 58 22 Z" class="ink" fill-opacity="0.08"/>
    <rect x="66" y="36" width="94" height="7" rx="3.5" class="ink" fill-opacity="0.35"/>
    <rect x="66" y="52" width="62" height="7" rx="3.5" class="ink" fill-opacity="0.35"/>
    <text x="138" y="61" class="font accent" font-size="15" font-weight="700">€</text>
    <!-- answer bubble with SKU citations -->
    <path d="M20 96 H140 Q146 96 146 102 V192 Q146 198 140 198 H32 L20 208 L22 198 H20 Q14 198 14 192 V102 Q14 96 20 96 Z" class="accent" fill-opacity="0.12"/>
    <rect x="26" y="112" width="70" height="7" rx="3.5" class="ink" fill-opacity="0.3"/>
    <rect x="100" y="109" width="36" height="13" rx="6.5" class="accent"/>
    <rect x="26" y="134" width="40" height="7" rx="3.5" class="ink" fill-opacity="0.3"/>
    <rect x="70" y="131" width="36" height="13" rx="6.5" class="accent"/>
    <rect x="110" y="134" width="26" height="7" rx="3.5" class="ink" fill-opacity="0.3"/>
    <rect x="26" y="156" width="56" height="7" rx="3.5" class="ink" fill-opacity="0.3"/>
    <rect x="86" y="153" width="36" height="13" rx="6.5" class="accent"/>
    <rect x="26" y="178" width="84" height="7" rx="3.5" class="ink" fill-opacity="0.3"/>
  </g>
  <g fill="none" stroke="#6B8F71" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1042 160 H1068"/>
    <path d="M1060 151 L1069 160 L1060 169"/>
  </g>
  <!-- Product cards: dress, shoes, bag; each one exists in the catalog (check) -->
  <g transform="translate(1082 50)">
    <g>
      <rect width="150" height="62" rx="12" fill="#FFFFFF" stroke="#1F1B24" stroke-opacity="0.12" stroke-width="2"/>
      <rect x="10" y="9" width="44" height="44" rx="8" fill="#F6F1E9"/>
      <path transform="translate(10 9) scale(0.367)" d="M46,10 L74,10 L72,38 Q86,46 98,110 L22,110 Q34,46 48,38 Z" class="accent"/>
      <rect x="64" y="18" width="50" height="8" rx="4" class="ink" fill-opacity="0.55"/>
      <rect x="64" y="36" width="30" height="7" rx="3.5" class="ink" fill-opacity="0.2"/>
      <circle cx="132" cy="22" r="9" class="accent"/>
      <path d="M127.5 22 L131 25.5 L137 19" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(0 79)">
      <rect width="150" height="62" rx="12" fill="#FFFFFF" stroke="#1F1B24" stroke-opacity="0.12" stroke-width="2"/>
      <rect x="10" y="9" width="44" height="44" rx="8" fill="#F6F1E9"/>
      <path transform="translate(10 9) scale(0.367)" d="M14,60 L46,60 Q60,76 86,78 Q108,82 108,94 L108,100 L14,100 Z" class="ink" fill-opacity="0.75"/>
      <rect x="64" y="18" width="44" height="8" rx="4" class="ink" fill-opacity="0.55"/>
      <rect x="64" y="36" width="30" height="7" rx="3.5" class="ink" fill-opacity="0.2"/>
      <circle cx="132" cy="22" r="9" class="accent"/>
      <path d="M127.5 22 L131 25.5 L137 19" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(0 158)">
      <rect width="150" height="62" rx="12" fill="#FFFFFF" stroke="#1F1B24" stroke-opacity="0.12" stroke-width="2"/>
      <rect x="10" y="9" width="44" height="44" rx="8" fill="#F6F1E9"/>
      <path transform="translate(10 9) scale(0.367)" d="M24,44 L96,44 L104,106 L16,106 Z M42,44 Q42,14 60,14 Q78,14 78,44" fill="#D8C3A5" stroke="#1F1B24" stroke-opacity="0.35" stroke-width="4"/>
      <rect x="64" y="18" width="56" height="8" rx="4" class="ink" fill-opacity="0.55"/>
      <rect x="64" y="36" width="30" height="7" rx="3.5" class="ink" fill-opacity="0.2"/>
      <circle cx="132" cy="22" r="9" class="accent"/>
      <path d="M127.5 22 L131 25.5 L137 19" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
